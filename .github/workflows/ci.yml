name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tipos, análisis, pruebas, arquitectura y compilación
    runs-on: ubuntu-24.04
    # B07: 63 recorridos, 5,8 min locales con dos trabajadores.
    # CI conserva uno: reservar margen para ejecución serial e instalación.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Instalar Chrome y dependencias de navegador
        run: npx playwright install --with-deps chrome
      - name: Recorridos de Chrome
        timeout-minutes: 20
        shell: bash
        run: |
          node dist-server/server/main.js > "$RUNNER_TEMP/karta3-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/karta3-server.log"
            exit 1
          fi
          npx playwright test
        env:
          CI: 'true'
