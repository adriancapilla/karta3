name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      chrome_diagnostic:
        description: 'Regex para diagnóstico focal; vacío ejecuta la batería completa. No acredita integración.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.chrome_diagnostic != '' && 'Diagnóstico focal Chrome (no batería completa)' || 'Tipos, análisis, pruebas, arquitectura y compilación' }}
    runs-on: ubuntu-24.04
    # B15: CI 38592289027 agotó 20 min tras 144/152 resultados, con un fallo Solar pendiente.
    # B17: global39068017172 duró24m30s con4 fallos; Linux38/39072554983 emplea96,557s
    # más en los38 casos comunes (proyección orientativa26m04s). Chrome30/trabajo35;
    # misma batería y criterios, un trabajador/cero reintentos. No modifica plazos del producto.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Instalar Chrome y dependencias de navegador
        run: npx playwright install --with-deps chrome
      - name: Recorridos de Chrome
        timeout-minutes: 30
        shell: bash
        run: |
          node dist-server/server/main.js > "$RUNNER_TEMP/karta3-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/karta3-server.log"
            exit 1
          fi
          if [ -n "$CHROME_DIAGNOSTIC" ]; then
            npx playwright test --grep "$CHROME_DIAGNOSTIC" --trace retain-on-failure --reporter=list,json
          else
            npx playwright test --reporter=list,json
          fi
        env:
          CI: 'true'
          CHROME_DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.chrome_diagnostic || '' }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/karta3-browser.json
      - name: Conservar resultados y diagnósticos de Chrome
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: karta3-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/karta3-browser.json
            test-results/
            playwright-report/b17-adenda/acceptance/
          if-no-files-found: warn
          retention-days: 7

  image:
    # El diagnóstico manual focal no construye imágenes ni sustituye CI completa.
    if: github.event_name != 'workflow_dispatch' || inputs.chrome_diagnostic == ''
    name: Imagen Linux amd64 y Compose/Caddy HTTPS
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - name: Instalar transporte OCI y preparar constructor aislado
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
          docker buildx create --driver docker-container --name karta3-ci --use
      - name: Construir, comprobar y conservar la misma imagen sin publicar
        timeout-minutes: 20
        run: bash tools/ci-image.sh
        env:
          CI: 'true'
          CHECKED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Conservar imagen OCI y trazabilidad comprobadas
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: karta3-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/karta3-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
