name: Publicar OCI comprobado en GHCR privado

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Ejecución CI completa correcta que conserva el OCI
        required: true
        type: string
      artifact_id:
        description: ID del artefacto OCI de esa ejecución
        required: true
        type: string
      integration_sha:
        description: SHA completo de integración con el mismo árbol que el commit fuente
        required: true
        type: string
      expected_digest:
        description: Digest del manifiesto OCI aprobado
        required: true
        type: string
      source_association_reviewed:
        description: Repository source comprobado en Package settings; solo necesario si la API devuelve repository nulo
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-karta3-oci
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Instalar transporte OCI
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - name: Publicar el archivo comprobado y verificar descarga por digest
        run: bash tools/publish-oci.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          INTEGRATION_SHA: ${{ inputs.integration_sha }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          SOURCE_ASSOCIATION_REVIEWED: ${{ inputs.source_association_reviewed }}
      - name: Conservar evidencia de publicación y descarga
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: karta3-publicacion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/karta3-publication-proof/
          if-no-files-found: error
          retention-days: 90
