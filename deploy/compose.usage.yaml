# Configuración B19: OFF predeterminado; activar exige autorización operativa separada.
# Ensayos con datos fabricados únicamente en una pila propia aislada.
services:
  app:
    environment:
      KARTA3_ENV: ${KARTA3_ENV:?Entorno administrativo explícito}
      KARTA3_USAGE_COLLECTION: ${KARTA3_USAGE_COLLECTION:-off}
      KARTA3_USAGE_DIRECTORY: /var/lib/karta3/usage
    volumes:
      - usage_data:/var/lib/karta3/usage

volumes:
  usage_data:
    # Un proyecto y volumen distintos por entorno; no compartir Pruebas/Play/test.
